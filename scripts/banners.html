<!doctype html>
<!-- Баннеры для сообщений бота. Рендер: node scripts/banners.js (Chrome headless делает PNG в assets/) -->
<html lang="ru"><head><meta charset="utf-8">
<script src="../public/mascot.js"></script>
<style>
  html, body { margin: 0; width: 1200px; height: 600px; overflow: hidden; background: #0b0b0d; font-family: "Segoe UI", Arial, sans-serif; }
  .b { position: relative; width: 1200px; height: 600px; overflow: hidden; color: #fff; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .g1 { width: 620px; height: 620px; right: -80px; top: -120px; background: #ff7a1a88; }
  .g2 { width: 520px; height: 520px; left: -160px; bottom: -260px; background: var(--c2, #7c3aed66); }
  .dots { position: absolute; inset: 0; background-image: radial-gradient(#ffffff14 2px, transparent 2px); background-size: 34px 34px; mask-image: linear-gradient(90deg, #000, transparent 70%); }
  .hapa { position: absolute; right: 40px; bottom: -10px; width: 560px; height: 560px; filter: drop-shadow(0 30px 40px #0009); }
  .txt { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); max-width: 720px; }
  .tag { display: inline-block; background: #ff7a1a; color: #000; font-weight: 900; font-size: 26px; padding: 8px 20px; border-radius: 40px; letter-spacing: .04em; }
  h1 { font-size: 104px; line-height: .95; margin: 26px 0 18px; font-weight: 900; letter-spacing: -.03em; }
  h1 b { color: #ffc93c; }
  p { font-size: 34px; color: #d4d4d8; margin: 0; font-weight: 600; }
</style></head>
<body>
<div class="b" id="b"></div>
<script>
const B = {
  start:    { tag: 'ХАПА SHOP', h: 'Хапнул —<br><b>и доволен</b>', p: 'Нейросети, игры и Telegram<br>по ценам ниже рынка', m: 'hi', c2: '#7c3aed66' },
  products: { tag: 'КАТАЛОГ', h: 'Выбирай,<br><b>не стесняйся</b>', p: 'Выдача сразу после оплаты', m: 'wow', c2: '#0ea5e966' },
  profile:  { tag: 'ПРОФИЛЬ', h: 'Твоя<br><b>нычка</b>', p: 'Баланс, покупки и бонусы', m: 'money', c2: '#16a34a55' },
  ref:      { tag: 'РЕФКА ДО 20%', h: 'Зови друзей<br><b>хапай с них</b>', p: 'Процент с каждой их покупки.<br>Навсегда.', m: 'money', c2: '#eab30866' },
  about:    { tag: 'О ШОПЕ', h: 'Кот<br><b>не обманет</b>', p: 'Гарантия, поддержка, замены', m: 'hi', c2: '#ec489966' },
};
const k = new URLSearchParams(location.search).get('b') || 'start';
const d = B[k];
document.getElementById('b').innerHTML = `<div class="glow g1"></div><div class="glow g2" style="--c2:${d.c2}"></div><div class="dots"></div>
  ${mascot(d.m)}<div class="txt"><span class="tag">${d.tag}</span><h1>${d.h}</h1><p>${d.p}</p></div>`;
</script>
</body></html>
