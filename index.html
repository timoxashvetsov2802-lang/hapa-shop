<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Хапа Shop</title>
<link rel="preconnect" href="https://telegram.org">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
// версия файлов приходит из кнопки бота (?v=), чтобы Telegram не держал старый кэш
(function () {
  var v = encodeURIComponent(new URLSearchParams(location.search).get('v') || '1');
  document.write('<link rel="stylesheet" href="style.css?v=' + v + '">');
  ['vendor/lottie.js', 'mascot.js', 'app.js'].forEach(function (f) { document.write('<script src="' + f + '?v=' + v + '" defer><\/script>'); });
})();
</script>
</head>
<body>
<div id="app">
  <section class="tab" data-tab="shop"><div class="sk"></div><div class="sk-grid"><i></i><i></i><i></i><i></i></div></section>
  <section class="tab" data-tab="orders" hidden></section>
  <section class="tab" data-tab="ref" hidden></section>
  <section class="tab" data-tab="profile" hidden></section>
</div>
<div id="pages"></div>
<nav id="nav">
  <span class="ind"></span>
  <button data-tab="shop" class="on" aria-label="Магазин"><svg viewBox="0 0 24 24"><path class="f" d="M5.5 8.5h13l-.9 10.6a2 2 0 01-2 1.9H8.4a2 2 0 01-2-1.9z"/><path d="M9 10V7a3 3 0 016 0v3"/></svg></button>
  <button data-tab="orders" aria-label="Покупки"><svg viewBox="0 0 24 24"><rect class="f" x="3.5" y="4.5" width="17" height="5" rx="1.5"/><path class="f" d="M5 9.5h14v8.5a2 2 0 01-2 2H7a2 2 0 01-2-2z"/><path class="k" d="M9.5 14.5l1.8 1.8 3.4-3.6"/></svg></button>
  <button data-tab="ref" aria-label="Рефка"><svg viewBox="0 0 24 24"><rect class="f" x="3.5" y="9" width="17" height="11.5" rx="2"/><path d="M2.5 9h19v-.5a1.5 1.5 0 00-1.5-1.5H4a1.5 1.5 0 00-1.5 1.5z"/><path class="k" d="M12 7v13.5"/><path d="M12 7c-1-3-5.5-4-5.5-1.5S10 7 12 7zm0 0c1-3 5.5-4 5.5-1.5S14 7 12 7z"/></svg></button>
  <button data-tab="profile" aria-label="Профиль"><svg viewBox="0 0 24 24"><circle class="f" cx="12" cy="8" r="4"/><path class="f" d="M4.5 20c.8-4 3.7-6 7.5-6s6.7 2 7.5 6z"/></svg></button>
</nav>
<div id="sheet"></div>
<div id="toast" hidden></div>
</body>
</html>
